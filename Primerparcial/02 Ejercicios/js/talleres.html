<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href= "style.css">
</head>
<body>
    <header>
        <h1>Ejercicios de Node.js</h1>
    </header>

    <main>
        <section class="ejercicio">
            <h2 id="titulo-arreglos"> Arreglos del código
                <code>Arreglos</code> </h2>
            <p>Datos de prueba con JS</p>

        <div class="Tabla scroll"></div>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Instructor</th>
                    <th>Cupos</th>
                    <th>Inscritos</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
        </div>

        <form id ="form-arreglos" class="formulario">
            <div class="campos">
                <label for="operacion-arreglos" name="operacion-arreglo">Operacion</label> 
                <select id="operacion-arreglo" name="operacion-arreglo">
                    <option value="forEach">forEach</option>
                    <option value="map">map</option>
                    <option value="filter">filter</option>
                    <option value="find">find</option>
                    <option value="reduce">reduce</option>
                    <option value="filter + map">filter + map</option>
                </select>
            </div>
            <button type="submit">Ejecutar</button>
        </form>
        
        <div class="resultado-contenedor">
            <h3>Resultado:</h3>
            <pre id="resultado-arreglo"></pre>
        </div>
    </section>

    <section class="ejercicio" aria-labelledby="titulo-objeto">
        <h2 id="titulo-objeto"> Segunda parte de ejercicios manejo de objetos y JSON</h2>
        <p>Edita el Taller y elige una operación</p>

        <form class="formulario" id="form-objetos">
            <div class="campos">
                <label for="obj-nombre">Nombre </label>
                <input type="text" id="obj-nombre" name="obj-nombre" value="Introducción a Python">
            </div>
            <div class="campo-corta">
                    <label for="obj-instructor">Instructor</label>
                    <input type="text" id="obj-instructor" name="obj-instructor" value="Ing. María López">
                </div>

                <div class="campo-corta">
                    <label for="obj-cupo">Cupo</label>
                    <input type="text" id="obj-cupo" name="obj-cupo" value="25" min="0">
                </div>

                <div class="campo-corta">
                    <label for="obj-inscritos">Inscritos</label>
                    <input type="text" id="obj-inscritos" name="obj-inscritos" value="25" min="0">
                </div>

                <div class="campo">
                    <label for="operacion-objeto">Operación a realizar</label>
                    <select name="operacion-objeto" id="operacion-objeto">
                        <option value="keys">Object.keys</option>
                        <option value="values">Object.value</option>
                        <option value="entries">Object.entries</option>
                        <option value="stringify">JSON.stringify</option>
                        <option value="roundtrip">Ida y vuelta de cadena a JSON</option>
                    </select>
                </div>
                <button type="submit">Ejecutar opción de objeto</button>
            </form>
            <output class="resultado" id="resultado-objeto" for="form-objeto"></output>

        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
